<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千房HD 売上ダッシュボード v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.15);
  --text1:#1a1917;--text2:#6b6a64;--text3:#9c9b95;
  --blue:#1a6fc4;--blue-l:#deeaf8;
  --green:#1a7a54;--green-l:#d8f0e6;
  --red:#c0392b;--red-l:#fce8e6;
  --amber:#9a6108;--amber-l:#fdf0d5;
  --purple:#5c47b8;--purple-l:#eeecfc;
  --teal:#0e8c99;--teal-l:#d6f3f6;
  --chibo:#c0392b;
  --r:10px;--rs:6px;
}
body{font-family:'Helvetica Neue','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;min-height:100vh}

/* LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;transition:width .2s}
.sidebar.collapsed{width:52px;min-width:52px}
.main{flex:1;overflow-y:auto;padding:24px}

/* SIDEBAR HEADER */
.sb-header{padding:16px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--chibo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.logo-text{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.sidebar.collapsed .logo-text,.sidebar.collapsed .logo-sub{display:none}

/* DEPT TABS — 部署タブ */
.dept-tabs{padding:10px 10px 4px;border-bottom:1px solid var(--border);flex-shrink:0}
.dept-label{font-size:10px;color:var(--text3);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;padding:0 2px}
.sidebar.collapsed .dept-label{visibility:hidden}
.dept-tab{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:7px 8px;border:none;background:none;
  border-radius:var(--rs);cursor:pointer;font-size:12px;
  color:var(--text2);text-align:left;transition:all .15s;
  white-space:nowrap;overflow:hidden;margin-bottom:2px;
}
.dept-tab:hover{background:var(--surface2);color:var(--text1)}
.dept-tab.active{font-weight:600;color:#fff}
.dept-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar.collapsed .dept-tab span:last-child{display:none}

/* VIEW NAV */
.nav-section{padding:8px 10px 4px}
.nav-label{font-size:10px;color:var(--text3);padding:0 2px;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.sidebar.collapsed .nav-label{visibility:hidden}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;color:var(--text2);font-size:12px;transition:all .15s;white-space:nowrap;overflow:hidden;border:none;background:none;width:100%;text-align:left;margin-bottom:1px}
.nav-item:hover{background:var(--surface2);color:var(--text1)}
.nav-item.active{background:var(--blue-l);color:var(--blue);font-weight:500}
.nav-icon{font-size:16px;flex-shrink:0;width:18px;text-align:center}
.sidebar.collapsed .nav-item span:last-child{display:none}

/* FILTER */
.filter-section{padding:10px 10px 8px;border-top:1px solid var(--border);margin-top:auto;flex-shrink:0}
.sidebar.collapsed .filter-section{display:none}
.filter-label{font-size:10px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.filter-row{margin-bottom:7px}
.filter-row label{font-size:11px;color:var(--text2);display:block;margin-bottom:2px}
.filter-row select{width:100%;font-size:11px;padding:4px 6px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surface);color:var(--text1);cursor:pointer}

.toggle-btn{position:absolute;top:16px;right:-11px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--text2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sb-wrap{position:relative;display:flex}

/* DEPT BANNER */
.dept-banner{border-radius:var(--r);padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.dept-banner-icon{font-size:24px}
.dept-banner-name{font-size:16px;font-weight:700;color:#fff}
.dept-banner-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:600;color:var(--text1)}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px}
.topbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip.on{background:var(--blue-l);color:var(--blue);border-color:rgba(26,111,196,.2)}
.month-range{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
.month-range select{font-size:11px;padding:4px 7px;border:1px solid var(--border2);border-radius:var(--rs)}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:24px;font-weight:600;color:var(--text1);line-height:1.1}
.metric-sub{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.dbadge{font-size:11px;padding:2px 6px;border-radius:99px;font-weight:500}
.dbadge.up{background:var(--green-l);color:var(--green)}
.dbadge.dn{background:var(--red-l);color:var(--red)}
.dbadge.neu{background:var(--surface2);color:var(--text3)}

/* SECTION */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.row21{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.row1{margin-bottom:14px}
@media(max-width:860px){.row2,.row21{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.ctitle{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.ctitle-l{display:flex;align-items:center;gap:6px}

/* TABLE */
.dtable{width:100%;border-collapse:collapse;font-size:12px}
.dtable th{padding:6px 9px;text-align:left;color:var(--text3);border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;font-size:11px}
.dtable td{padding:7px 9px;border-bottom:1px solid var(--border);color:var(--text1);white-space:nowrap}
.dtable tbody tr:last-child td{border-bottom:none}
.dtable tbody tr:hover{background:var(--surface2)}
.dtable .num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500}
.p-blue{background:var(--blue-l);color:var(--blue)}
.p-green{background:var(--green-l);color:var(--green)}
.p-red{background:var(--red-l);color:var(--red)}
.p-amber{background:var(--amber-l);color:var(--amber)}
.p-gray{background:var(--surface2);color:var(--text2)}
.p-purple{background:var(--purple-l);color:var(--purple)}
.p-teal{background:var(--teal-l);color:var(--teal)}

/* BAR */
.bwrap{display:flex;align-items:center;gap:7px}
.btrack{flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bfill{height:100%;border-radius:3px}

/* CROSS */
.cross-wrap{overflow-x:auto}
.ctable{width:100%;border-collapse:collapse;font-size:11px}
.ctable th,.ctable td{padding:6px 10px;border:1px solid var(--border);white-space:nowrap}
.ctable th{background:var(--surface2);font-weight:500;color:var(--text2)}
.ctable .total-col{background:var(--surface2);font-weight:500}
.hcell{text-align:right;font-variant-numeric:tabular-nums}

/* SEG */
.seg{display:flex;background:var(--surface2);border-radius:var(--rs);padding:2px}
.sbtn{padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:none;background:none;color:var(--text2);transition:all .15s}
.sbtn.active{background:var(--surface);color:var(--text1);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* STORE SCORECARD */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.store-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:box-shadow .15s}
.store-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.store-card-name{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text1)}
.store-card-uri{font-size:18px;font-weight:700;color:var(--text1)}
.store-card-meta{display:flex;gap:6px;margin-top:5px;align-items:center}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text2);z-index:100}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:12px}
</style>
</head>

<div class="layout">
  <div class="sb-wrap">
    <div class="sidebar" id="sidebar">

      <div class="sb-header">
        <div class="logo-mark">千</div>

          <div class="logo-text">千房HD</div>
          <div class="logo-sub">売上ダッシュボード</div>
        </div>
      </div>

      <!-- 部署タブ -->
      <div class="dept-tabs">
        <div class="dept-label">部署</div>
        <button class="dept-tab active" id="dt-all" onclick="switchDept('all',this)" style="background:#444;color:#fff">
          <div class="dept-dot" style="background:#aaa"></div><span>全社</span>
        </button>
        <button class="dept-tab" id="dt-eigyo" onclick="switchDept('eigyo',this)">
          <div class="dept-dot" style="background:#1a6fc4"></div><span>営業本部</span>
        </button>
        <button class="dept-tab" id="dt-fc" onclick="switchDept('fc',this)">
          <div class="dept-dot" style="background:#9a6108"></div><span>FC</span>

          <div class="dept-dot" style="background:#c0392b"></div><span>IZAKAYA</span>
        </button>
        <button class="dept-tab" id="dt-oden" onclick="switchDept('oden',this)">
          <div class="dept-dot" style="background:#5c47b8"></div><span>ODEN</span>
        </button>
        <button class="dept-tab" id="dt-global" onclick="switchDept('global',this)">
          <div class="dept-dot" style="background:#0e8c99"></div><span>グローバル</span>
        </button>
      </div>

      <!-- ビュー -->
      <div class="nav-section">
        <div class="nav-label">ビュー</div>
        <button class="nav-item active" onclick="switchView('overview',this)"><span class="nav-icon">📊</span><span>概要</span></button>
        <button class="nav-item" onclick="switchView('stores',this)"><span class="nav-icon">🏪</span><span>店舗一覧</span></button>
        <button class="nav-item" onclick="switchView('trend',this)"><span class="nav-icon">📈</span><span>月次推移</span></button>
        <button class="nav-item" onclick="switchView('budget',this)"><span class="nav-icon">🎯</span><span>予算達成</span></button>
        <button class="nav-item" onclick="switchView('cross',this)"><span class="nav-icon">🔀</span><span>クロス分析</span></button>
      </div>

      <!-- フィルタ -->
      <div class="filter-section">
        <div class="filter-label">絞り込み</div>
        <div class="filter-row">
          <label>地方区分</label>
          <select id="f-area" onchange="applyFilters()">
            <option value="">すべて</option>
            <option value="近畿">近畿</option>
            <option value="関東">関東</option>
            <option value="中部">中部</option>
            <option value="東北">東北</option>
            <option value="中国">中国</option>
            <option value="四国">四国</option>
            <option value="北海道">北海道</option>
            <option value="アジア">アジア</option>
          </select>
        </div>
      </div>
    </div>
    <button class="toggle-btn" id="toggle-btn" onclick="toggleSidebar()">◀</button>
  </div>

  <main class="main">
    <!-- DEPT BANNER -->
    <div class="dept-banner" id="dept-banner" style="background:#2c2c2a">
      <div class="dept-banner-icon" id="banner-icon">🏢</div>
      <div>
        <div class="dept-banner-name" id="banner-name">全社</div>
        <div class="dept-banner-sub" id="banner-sub">千房ホールディングス 全部署</div>
      </div>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title">概要</div>
        <div class="page-sub" id="page-sub">—</div>
      </div>
      <div class="topbar-right">
        <div class="month-range">
          <span>期間</span>
          <select id="m-from" onchange="applyFilters()"></select>
          <span>〜</span>
          <select id="m-to" onchange="applyFilters()"></select>
        </div>
        <div class="chip" id="chip-area" style="display:none"></div>
        <div class="chip" id="gas-status" style="font-size:10px;color:var(--text3)">● スタティックデータ</div>
      </div>
    </div>

    <div class="metrics-grid" id="metrics-row"></div>

    <div id="view-overview"></div>
    <div id="view-stores" style="display:none"></div>
    <div id="view-trend" style="display:none"></div>
    <div id="view-budget" style="display:none"></div>
    <div id="view-cross" style="display:none"></div>
  </main>
</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div>読み込み中...</div>

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
  if (GAS_URL && GAS_URL !== 'YOUR_GAS_WEB_APP_URL') {
    loadFromGAS();
  } else {
    // GAS未設定: スタティックデータで起動
    allData = ALL_DATA;
    initDashboard();
  }
});

function loadFromGAS() {
  const cbName = 'gasCallback_' + Date.now();
  const script = document.createElement('script');
  script.src = GAS_URL + '?callback=' + cbName;
  script.onerror = () => {
    console.warn('GAS fetch failed, falling back to static data');
    allData = ALL_DATA;
    initDashboard();
    document.getElementById('loading').style.display = 'none';
  };
  window[cbName] = (res) => {
    if (res && res.status === 'ok' && res.data) {
      allData = res.data;
      document.getElementById('gas-status').textContent = '● GAS接続中 ' + res.count + '件';
      document.getElementById('gas-status').style.color = '#1a7a54';
    } else {
      console.warn('GAS error, using static data:', res && res.error);
      allData = ALL_DATA;
      document.getElementById('gas-status').textContent = '● スタティックデータ';
      document.getElementById('gas-status').style.color = '#9a6108';
    }
    initDashboard();
    document.getElementById('loading').style.display = 'none';
    delete window[cbName];
  };
  document.head.appendChild(script);
}

// 年月フィールドを YYYY-MM 形式に正規化
function normalizeNengetsu(val) {
  if (!val) return null;
  const s = String(val).trim();
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  }
  const slash = s.match(/^(\d{4})\/(\d{2})/);
  if (slash) return `${slash[1]}-${slash[2]}`;
  return s;
}

function initDashboard() {
  allData = allData.map(d => ({
    ...d,
    '\u5e74\u6708': normalizeNengetsu(d['\u5e74\u6708'])
  })).filter(d => d['\u5e74\u6708']);
  allMonths = [...new Set(allData.map(d=>d['\u5e74\u6708']))].sort();
  buildMonthSelectors();
  applyFilters();
  document.getElementById('loading').style.display = 'none';
}

function buildMonthSelectors() {
  ['m-from','m-to'].forEach((id,i) => {
    const el = document.getElementById(id);
    allMonths.forEach(m => el.innerHTML += `<option value="${m}" ${i===1?'selected':''}>${m}</option>`);
  });
}

function toggleSidebar() {
  sbCollapsed = !sbCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sbCollapsed);
  document.getElementById('toggle-btn').textContent = sbCollapsed ? '▶' : '◀';
}

// ===== VIEW SWITCH =====
function switchView(name, btn) {
  currentView = name;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  const titles = {overview:'概要',stores:'店舗一覧',trend:'月次推移',budget:'予算達成',cross:'クロス分析'};
  document.getElementById('page-title').textContent = titles[name];
  ['overview','stores','trend','budget','cross'].forEach(v =>
    document.getElementById('view-'+v).style.display = v===name?'block':'none'
  );
  renderView();
}

// ===== FILTERS =====
function applyFilters() {
  const area  = document.getElementById('f-area').value;
  const mFrom = document.getElementById('m-from').value;
  const mTo   = document.getElementById('m-to').value;
  const dept  = DEPTS[currentDept];

  filtered = allData.filter(d =>
    (!area  || d['地方区分'] === area) &&
    (!mFrom || d['年月'] >= mFrom) &&
    (!mTo   || d['年月'] <= mTo) &&
    (!dept.filter || d['営業部'] === dept.filter)
  );

  const chipArea = document.getElementById('chip-area');
  chipArea.style.display = area ? 'block' : 'none';
  chipArea.textContent = area;
  chipArea.className = area ? 'chip on' : 'chip';

  const cnt = new Set(filtered.map(d=>d['店舗名'])).size;
  const period = mFrom===mTo ? mFrom : `${mFrom} 〜 ${mTo}`;
  document.getElementById('page-sub').textContent = `${period} ／ ${cnt}店舗`;

  renderMetrics();
  renderView();
}

// ===== METRICS =====
function fmtM(n) { return n==null?'―':'¥'+Math.round(n/1000).toLocaleString()+'千円'; }
function pctStr(a,b){ return a&&b?((a/b-1)*100).toFixed(1):null; }
function dc(v){ return v==null?'neu':parseFloat(v)>=0?'up':'dn'; }

function renderMetrics() {
  const uri   = filtered.reduce((s,d)=>s+(d['売上(千円)']||0),0);
  const upy   = filtered.reduce((s,d)=>s+(d['前年売上(千円)']||0),0);
  const ubgt  = filtered.reduce((s,d)=>s+(d['予算(千円)']||0),0);
  const uky   = filtered.reduce((s,d)=>s+(d['客数']||0),0);
  const ukpy  = filtered.reduce((s,d)=>s+(d['前年客数']||0),0);
  const yoy   = pctStr(uri,upy);
  const kyYoy = pctStr(uky,ukpy);
  const bgt   = ubgt?((uri/ubgt)*100).toFixed(1):null;
  const tanka   = uky ?Math.round(uri/uky):0;
  const tankapy = ukpy?Math.round(upy/ukpy):0;
  const tankaYoy= tankapy?pctStr(tanka,tankapy):null;
  const cnt = new Set(filtered.map(d=>d['店舗名'])).size;

  const bdg=(v)=>v!=null?`<span class="dbadge ${dc(v)}">${parseFloat(v)>=0?'+':''}${v}%</span>`:`<span class="dbadge neu">前年比―</span>`;

  document.getElementById('metrics-row').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">売上</div>
      <div class="metric-value">${fmtM(uri)}</div>
      <div class="metric-sub">${bdg(yoy)}<span style="color:var(--text3)">前年 ${fmtM(upy)}</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">予算達成率</div>
      <div class="metric-value">${bgt!=null?bgt+'%':'―'}</div>
      <div class="metric-sub"><span style="color:var(--text3)">予算 ${fmtM(ubgt)}</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">客数</div>
      <div class="metric-value">${uky.toLocaleString()}人</div>
      <div class="metric-sub">${bdg(kyYoy)}<span style="color:var(--text3)">前年 ${ukpy.toLocaleString()}人</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">客単価</div>
      <div class="metric-value">¥${tanka.toLocaleString()}</div>
      <div class="metric-sub">${bdg(tankaYoy)}<span style="color:var(--text3)">前年 ¥${tankapy.toLocaleString()}</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">対象店舗数</div>
      <div class="metric-value">${cnt}店</div>
      <div class="metric-sub"><span style="color:var(--text3)">${filtered.length}レコード</span></div>
    </div>
  `;
}

// ===== VIEWS =====
function renderView() {
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});
  charts={};
  if(currentView==='overview') renderOverview();

}

function yoyList(items) {
  if(!items.length) return '<div class="empty">データなし</div>';
  return items.map(d=>{
    const v=(d.yoy*100).toFixed(1);
    const c=parseFloat(v)>=0?'p-green':'p-red';

    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div><div style="font-size:12px;font-weight:500">${d['店舗名']}</div>
      <div style="font-size:11px;color:var(--text3)">${d['地方区分']}${d['都道府県']?'·'+d['都道府県']:''} <span class="pill ${kc}" style="font-size:10px">${d['店舗区分']}</span></div></div>
      <span class="pill ${c}">${parseFloat(v)>=0?'+':''}${v}%</span>
    </div>`;
  }).join('');
}

// ---- STORES ----
function renderStores() {

    sm[k].uri+=d['売上(千円)']||0; sm[k].upy+=d['前年売上(千円)']||0;
    sm[k].bgt+=d['予算(千円)']||0; sm[k].ky+=d['客数']||0;

          <button class="sbtn" onclick="sortStores('bgt',this)">予算比順</button>

          </tr></thead>
          <tbody id="store-tbody"></tbody>
        </table>
      </div>
    </div>
  `;
  window._stores = stores;
  drawStoreRows(stores);
}

function drawStoreRows(stores) {
  const tb=document.getElementById('store-tbody');
  if(!tb) return;
  tb.innerHTML = stores.map((s,i)=>{
    const yoy=s.upy?pctStr(s.uri,s.upy):null;
    const bgt=s.bgt?((s.uri/s.bgt)*100).toFixed(1):null;
    const yc=yoy===null?'p-gray':parseFloat(yoy)>=0?'p-green':'p-red';
    const bc=bgt===null?'p-gray':parseFloat(bgt)>=100?'p-green':'p-red';
    const kc=s.kubun==='FC'?'p-amber':'p-blue';
    return `<tr>
      <td style="color:var(--text3)">${i+1}</td>
      <td style="font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis">${s.name}</td>
      <td><span class="pill ${kc}">${s.kubun}</span></td>
      <td><span class="pill p-gray">${s.gyotai}</span></td>
      <td style="color:var(--text2);font-size:11px">${s.kuni||s.area}</td>
      <td class="num">${Math.round(s.uri/1000).toLocaleString()}</td>
      <td class="num"><span class="pill ${yc}">${yoy!=null?(parseFloat(yoy)>=0?'+':'')+yoy+'%':'―'}</span></td>
      <td class="num"><span class="pill ${bc}">${bgt!=null?bgt+'%':'―'}</span></td>
      <td class="num">${s.ky.toLocaleString()}</td>
    </tr>`;
  }).join('');
}

function sortStores(k, btn) {
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const s=[...(window._stores||[])];
  if(k==='uri') s.sort((a,b)=>b.uri-a.uri);
  else if(k==='yoy') s.sort((a,b)=>(b.upy?b.uri/b.upy:0)-(a.upy?a.uri/a.upy:0));
  else s.sort((a,b)=>(b.bgt?b.uri/b.bgt:0)-(a.bgt?a.uri/a.bgt:0));
  drawStoreRows(s);
}

        <table class="dtable">
          <thead><tr><th>店舗名</th><th>区分</th><th>業態</th><th class="num">達成率</th><th style="min-width:160px">バー</th><th class="num">売上（千円）</th><th class="num">予算（万円）</th></tr></thead>
          <tbody>${stores.map((s,i)=>{
            const r=rates[i];const c=r>=100?'#1a7a54':'#c0392b';const kc=s.kubun==='FC'?'p-amber':'p-blue';
            return `<tr>
              <td style="font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</td>
              <td><span class="pill ${kc}">${s.kubun}</span></td>
              <td><span class="pill p-gray" style="font-size:10px">${s.gyotai}</span></td>
              <td class="num"><span style="font-weight:600;color:${c}">${r}%</span></td>
              <td><div class="bwrap"><div class="btrack"><div class="bfill" style="width:${Math.min(r,100)}%;background:${c}"></div></div></div></td>
              <td class="num">${Math.round(s.uri/1000).toLocaleString()}</td>
              <td class="num" style="color:var(--text3)">${Math.round(s.bgt/1000).toLocaleString()}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ---- CROSS ----
function renderCross() {
  const el = document.getElementById('view-cross');
  el.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="ctitle"><div class="ctitle-l">クロス分析設定</div></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
        ${mkSel('cross-row','行（縦軸）','業態,地方区分,店舗区分,都道府県,営業部')}
        ${mkSel('cross-col','列（横軸）','地方区分,業態,店舗区分,年月')}
        ${mkSel('cross-metric','指標','uri=売上（千円）,kyaku=客数,bgt=予算達成率(%),yoy=前年比(%)')}
      </div>
    </div>
    <div class="card"><div class="ctitle"><div class="ctitle-l">クロス集計表</div></div><div class="cross-wrap" id="cross-res"></div></div>
  `;
  document.getElementById('cross-row').onchange = buildCross;
  document.getElementById('cross-col').onchange = buildCross;
  document.getElementById('cross-metric').onchange = buildCross;
  buildCross();
}

function mkSelOv(id, label, opts, defaultVal) {
  const options = opts.split(',').map(o=>{
    const [v,t]=o.split('=');
    const sel = v===defaultVal ? ' selected' : '';
    return `<option value="${v}"${sel}>${t||v}</option>`;
  }).join('');
  return `<div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">${label}</label><select id="${id}" style="font-size:11px;padding:3px 6px;border:1px solid var(--border2);border-radius:var(--rs)">${options}</select></div>`;
}

function buildOvCross() {
  const rkEl=document.getElementById('ov-row');
  const ckEl=document.getElementById('ov-col');
  const mkEl=document.getElementById('ov-metric');
  const resEl=document.getElementById('ov-cross-res');
  if(!rkEl||!ckEl||!mkEl||!resEl) return;
  const rk=rkEl.value, ck=ckEl.value, mk=mkEl.value;

  const rv=[...new Set(filtered.map(d=>d[rk]).filter(Boolean))].sort();
  const cv=[...new Set(filtered.map(d=>d[ck]).filter(Boolean))].sort();

  const calc=(r,c)=>{
    const rows=filtered.filter(d=>d[rk]===r&&d[ck]===c);
    if(!rows.length) return null;
    const uri=rows.reduce((s,d)=>s+(d['売上(千円)']||0),0);
    const upy=rows.reduce((s,d)=>s+(d['前年売上(千円)']||0),0);
    const bgt=rows.reduce((s,d)=>s+(d['予算(千円)']||0),0);
    const ky =rows.reduce((s,d)=>s+(d['客数']||0),0);
    if(mk==="uri")   return Math.round(uri/1000);
    if(mk==='kyaku') return ky;
    if(mk==='bgt')   return bgt?parseFloat(((uri/bgt)*100).toFixed(1)):null;
    if(mk==='yoy')   return upy?parseFloat(((uri/upy-1)*100).toFixed(1)):null;
  };
  const rowTotal=r=>{
    const rows=filtered.filter(d=>d[rk]===r);
    const uri=rows.reduce((s,d)=>s+(d['売上(千円)']||0),0);
    if(mk==="uri")   return Math.round(uri/1000);
    const ky=rows.reduce((s,d)=>s+(d['客数']||0),0);
    if(mk==='kyaku') return ky;
    const bgt=rows.reduce((s,d)=>s+(d['予算(千円)']||0),0);
    if(mk==='bgt')   return bgt?parseFloat(((uri/bgt)*100).toFixed(1)):null;
    const upy=rows.reduce((s,d)=>s+(d['前年売上(千円)']||0),0);
    if(mk==='yoy')   return upy?parseFloat(((uri/upy-1)*100).toFixed(1)):null;
  };

  const vals=rv.flatMap(r=>cv.map(c=>calc(r,c))).filter(v=>v!=null&&isFinite(v));
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0);

  const hbg=v=>{
    if(v==null||!isFinite(v)) return '';
    if(mk==='bgt'||mk==='yoy'){
      const thr=mk==='bgt'?100:0;
      return v>=thr?`rgba(26,122,84,${Math.min(Math.abs(v-thr)/50,1)*.3})`:`rgba(192,57,43,${Math.min(Math.abs(v-thr)/50,1)*.3})`;
    }
    const norm=mx===mn?.5:(v-mn)/(mx-mn);
    return `rgba(26,111,196,${norm*.35})`;
  };
  const fv=v=>v==null||!isFinite(v)?'―':(mk==='uri'||mk==='kyaku')?v.toLocaleString():v+'%';

  resEl.innerHTML=`<table class="ctable">
    <thead><tr>
      <th style="min-width:80px">${rk}＼${ck}</th>
      ${cv.map(c=>`<th>${c}</th>`).join('')}
      <th class="total-col">合計</th>
    </tr></thead>
    <tbody>${rv.map(r=>`<tr>
      <th>${r}</th>
      ${cv.map(c=>{const v=calc(r,c);return`<td class="hcell" style="background:${hbg(v)}">${fv(v)}</td>`;}).join('')}
      <td class="hcell total-col">${fv(rowTotal(r))}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function mkSel(id, label, opts) {
  const options = opts.split(',').map(o=>{const[v,t]=o.split('=');return `<option value="${v}">${t||v}</option>`;}).join('');
  return `<div><label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px">${label}</label><select id="${id}" style="font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:var(--rs)">${options}</select></div>`;
}

function buildCross() {
  const rk=document.getElementById('cross-row').value;
  const ck=document.getElementById('cross-col').value;
  const mk=document.getElementById('cross-metric').value;
  const rv=[...new Set(filtered.map(d=>d[rk]).filter(Boolean))].sort();
  const cv=[...new Set(filtered.map(d=>d[ck]).filter(Boolean))].sort();

  const calc=(r,c,data=filtered)=>{
    const rows=data.filter(d=>d[rk]===r&&d[ck]===c);
    if(!rows.length) return null;
    const uri=rows.reduce((s,d)=>s+(d['売上(千円)']||0),0);
    const upy=rows.reduce((s,d)=>s+(d['前年売上(千円)']||0),0);
    const bgt=rows.reduce((s,d)=>s+(d['予算(千円)']||0),0);
    const ky =rows.reduce((s,d)=>s+(d['客数']||0),0);
    if(mk==="uri") return Math.round(uri/1000);
    if(mk==='kyaku') return ky;
    if(mk==='bgt') return bgt?parseFloat(((uri/bgt)*100).toFixed(1)):null;
    if(mk==='yoy') return upy?parseFloat(((uri/upy-1)*100).toFixed(1)):null;
  };
  const rowTotal=r=>{
    const rows=filtered.filter(d=>d[rk]===r);
    const uri=rows.reduce((s,d)=>s+(d['売上(千円)']||0),0);
    if(mk==="uri") return Math.round(uri/1000);
    const ky=rows.reduce((s,d)=>s+(d['客数']||0),0);
    if(mk==='kyaku') return ky;
    const bgt=rows.reduce((s,d)=>s+(d['予算(千円)']||0),0);
    if(mk==='bgt') return bgt?parseFloat(((uri/bgt)*100).toFixed(1)):null;
    const upy=rows.reduce((s,d)=>s+(d['前年売上(千円)']||0),0);
    if(mk==='yoy') return upy?parseFloat(((uri/upy-1)*100).toFixed(1)):null;
  };

  const vals=rv.flatMap(r=>cv.map(c=>calc(r,c))).filter(v=>v!=null&&isFinite(v));
  const mx=Math.max(...vals,0),mn=Math.min(...vals,0);

  const hbg=v=>{
    if(v==null||!isFinite(v)) return '';
    if(mk==='bgt'||mk==='yoy') return v>=(mk==='bgt'?100:0)?`rgba(26,122,84,${Math.min(Math.abs(v-(mk==='bgt'?100:0))/50,1)*.3})`:`rgba(192,57,43,${Math.min(Math.abs(v-(mk==='bgt'?100:0))/50,1)*.3})`;
    const norm=mx===mn?.5:(v-mn)/(mx-mn);
    return `rgba(26,111,196,${norm*.35})`;
  };
  const fv=v=>v==null||!isFinite(v)?'―':(mk==='uri'||mk==='kyaku')?v.toLocaleString():v+'%';

  document.getElementById('cross-res').innerHTML = `<table class="ctable">
    <thead><tr><th>${rk}＼${ck}</th>${cv.map(c=>`<th>${c}</th>`).join('')}<th class="total-col">合計</th></tr></thead>
    <tbody>${rv.map(r=>`<tr><th>${r}</th>${cv.map(c=>{const v=calc(r,c);return`<td class="hcell" style="background:${hbg(v)}">${fv(v)}</td>`;}).join('')}<td class="hcell total-col">${fv(rowTotal(r))}</td></tr>`).join('')}</tbody>
  </table>`;
}

// ===== UTILS =====
function gsum(data, key) {
  const m={};
  data.forEach(d=>{
    const k=d[key]||'その他';
    if(!m[k]) m[k]={uri:0,upy:0,bgt:0,ky:0};
    m[k].uri+=d['売上(千円)']||0; m[k].upy+=d['前年売上(千円)']||0;
    m[k].bgt+=d['予算(千円)']||0; m[k].ky+=d['客数']||0;
  });
  return m;
}
